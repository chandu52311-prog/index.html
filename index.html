<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSC Official Photo & Signature Resizer (2026)</title>
  <meta name="description" content="Free tool to resize Photo (20-50 KB) and Signature (10-20 KB) for SSC CGL, CHSL, MTS, and GD official applications.">
  
  <!-- Mee Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="iId_f8e82ivBzeD_5ya7rZTJa2ama4Mkf80pJc08fws" />
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
    }
    body { 
      background-color: #f4f6f9; 
      color: #212529; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    
    /* SSC Official Header */
    .header-bar {
      width: 100%;
      background-color: #3d1318;
      color: #ffffff;
      padding: 16px 20px;
      text-align: center;
      border-bottom: 4px solid #e06b3a;
    }
    .header-bar h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .header-bar p {
      font-size: 0.8rem;
      color: #fce8e9;
      margin-top: 4px;
    }

    .container { 
      width: 100%; 
      max-width: 440px; 
      padding: 20px 16px 40px;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    /* Mode Switching Tabs */
    .tab-container {
      width: 100%;
      display: flex;
      background: #e2e8f0;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      color: #4b5563;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #3d1318;
      color: #ffffff;
    }

    /* Upload Frame */
    .upload-box { 
      width: 100%;
      height: 210px; 
      border: 2px dashed #7b242b; 
      border-radius: 10px; 
      background: #ffffff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      margin-bottom: 14px; 
      transition: background 0.2s;
    }
    .upload-box:hover {
      background: #fff8f8;
    }
    .upload-box img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      display: none; 
      padding: 6px;
    }
    .upload-box .icon { 
      font-size: 2.2rem; 
      color: #7b242b; 
      margin-bottom: 6px; 
    }
    .upload-box .placeholder-text { 
      font-size: 0.85rem; 
      font-weight: 600;
      color: #4b5563; 
      text-align: center; 
      padding: 0 10px; 
    }

    /* Action Buttons */
    .btn { 
      width: 100%; 
      padding: 14px; 
      border: none; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 0.95rem; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; }
    .btn-generate { 
      background: #7b242b; 
      color: #ffffff; 
    }
    .btn-download { 
      background: #2e7d32; 
      color: #ffffff; 
      margin-top: 14px; 
    }

    /* Output Card */
    .output-card { 
      width: 100%; 
      background: #ffffff; 
      border-radius: 10px; 
      border: 1px solid #d1d5db; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      padding: 16px; 
      margin-top: 18px; 
      display: none; 
      flex-direction: column; 
      align-items: center; 
    }
    .specs-pill { 
      background: #eef7ee; 
      border: 1px solid #2e7d32; 
      color: #1b5e20; 
      padding: 5px 12px; 
      border-radius: 20px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      margin-bottom: 12px; 
    }
    .output-preview { 
      max-width: 100%;
      border-radius: 6px; 
      border: 2px solid #2e7d32; 
      object-fit: contain; 
      margin-bottom: 6px; 
    }

    .footer-text {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- SSC Header -->
  <div class="header-bar">
    <h1>SSC PHOTO & SIGNATURE RESIZER</h1>
    <p>Official Guidelines • Photo: 20-50 KB | Signature: 10-20 KB</p>
  </div>

  <div class="container">
    <!-- Tabs -->
    <div class="tab-container">
      <button class="tab-btn active" id="tabPhoto" onclick="setMode('photo')">Passport Photo (20-50 KB)</button>
      <button class="tab-btn" id="tabSign" onclick="setMode('sign')">Signature (10-20 KB)</button>
    </div>

    <!-- Hidden Input -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
    
    <!-- Upload Frame -->
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div id="uploadPrompt" style="display: flex; flex-direction: column; align-items: center;">
        <span class="icon" id="modeIcon">📷</span>
        <span class="placeholder-text" id="uploadText">Tap to select Passport Photo</span>
      </div>
      <img id="inputPreview" alt="Selected Preview">
    </div>

    <!-- Generate Button -->
    <button class="btn btn-generate" id="generateBtn" onclick="generateSSCFile()">⚡ GENERATE SSC PHOTO</button>

    <!-- Output Preview Card -->
    <div class="output-card" id="outputCard">
      <div class="specs-pill" id="specsLabel">SSC APPROVED: 3.5cm x 4.5cm • 35 KB</div>
      <img id="outputImg" class="output-preview" alt="Generated File">
      
      <!-- Download Button -->
      <button class="btn btn-download" id="downloadBtn" onclick="handleDownload()">📥 Download</button>
    </div>

    <div class="footer-text">
      Offline Client-Side Processing • Mee photos ye server ki upload avvavu
    </div>
  </div>

  <script>
    let activeMode = 'photo'; // 'photo' leda 'sign'
    let rawImage = null;
    let base64Output = null;

    // Mee Adsterra Direct Link ikkada ivvandi:
    const ADSTERRA_DIRECT_LINK = "https://www.profitablecpmrate.com/your-direct-link-id"; 

    function setMode(mode) {
      activeMode = mode;
      rawImage = null;
      base64Output = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('inputPreview').style.display = 'none';
      document.getElementById('uploadPrompt').style.display = 'flex';
      document.getElementById('outputCard').style.display = 'none';

      if (mode === 'photo') {
        document.getElementById('tabPhoto').classList.add('active');
        document.getElementById('tabSign').classList.remove('active');
        document.getElementById('modeIcon').innerText = '📷';
        document.getElementById('uploadText').innerText = 'Tap to select Passport Photo';
        document.getElementById('generateBtn').innerText = '⚡ GENERATE SSC PHOTO';
      } else {
        document.getElementById('tabSign').classList.add('active');
        document.getElementById('tabPhoto').classList.remove('active');
        document.getElementById('modeIcon').innerText = '✍️';
        document.getElementById('uploadText').innerText = 'Tap to select Signature Image';
        document.getElementById('generateBtn').innerText = '⚡ GENERATE SSC SIGNATURE';
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const preview = document.getElementById('inputPreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('uploadPrompt').style.display = 'none';
        rawImage = new Image();
        rawImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function generateSSCFile() {
      if (!rawImage) { 
        alert(activeMode === 'photo' ? "Please upload your photo first!" : "Please upload your signature first!"); 
        return; 
      }

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      // Official Specifications
      // Photo: 3.5cm x 4.5cm -> 350x450 px | 20KB - 50KB
      // Signature: 4.0cm x 2.0cm -> 400x200 px | 10KB - 20KB
      const targetWidth = activeMode === 'photo' ? 350 : 400;
      const targetHeight = activeMode === 'photo' ? 450 : 200;
      const maxTargetKb = activeMode === 'photo' ? 45 : 18;
      const minTargetKb = activeMode === 'photo' ? 25 : 12;

      canvas.width = targetWidth;
      canvas.height = targetHeight;

      // Clean white background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, targetWidth, targetHeight);

      // Fit image properly
      const imgRatio = rawImage.width / rawImage.height;
      const targetRatio = targetWidth / targetHeight;
      let sWidth, sHeight, sx, sy;

      if (imgRatio > targetRatio) {
        sHeight = rawImage.height; 
        sWidth = rawImage.height * targetRatio;
        sx = (rawImage.width - sWidth) / 2; 
        sy = 0;
      } else {
        sWidth = rawImage.width; 
        sHeight = rawImage.width / targetRatio;
        sx = 0; 
        sy = (rawImage.height - sHeight) / 2;
      }

      ctx.drawImage(rawImage, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);

      // Quality adjustment for target KB
      let minQ = 0.1, maxQ = 0.98, targetQuality = 0.7;
      for (let i = 0; i < 7; i++) {
        let midQ = (minQ + maxQ) / 2;
        let testData = canvas.toDataURL('image/jpeg', midQ);
        let sizeKb = (testData.length * 0.75) / 1024;
        targetQuality = midQ;
        if (sizeKb > maxTargetKb) {
          maxQ = midQ;
        } else {
          minQ = midQ;
        }
      }

      base64Output = canvas.toDataURL('image/jpeg', targetQuality);
      const finalSizeKb = ((base64Output.length * 0.75) / 1024).toFixed(1);

      document.getElementById('outputImg').src = base64Output;
      const specText = activeMode === 'photo' 
        ? `SSC APPROVED: 3.5cm x 4.5cm • ${finalSizeKb} KB` 
        : `SSC APPROVED: 4.0cm x 2.0cm • ${finalSizeKb} KB`;

      document.getElementById('specsLabel').innerText = specText;
      document.getElementById('outputCard').style.display = 'flex';
      document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
    }

    // Download Handler
    function handleDownload() {
      if (!base64Output) return;

      // 1. Signature ayinappudu mathrame ad open avthundi:
      if (activeMode === 'sign' && ADSTERRA_DIRECT_LINK && !ADSTERRA_DIRECT_LINK.includes("your-direct-link-id")) {
        window.open(ADSTERRA_DIRECT_LINK, '_blank');
      }

      // 2. Direct ga file download start avthundi
      const link = document.createElement('a');
      link.href = base64Output;
      link.download = activeMode === 'photo' 
        ? `SSC_Passport_Photo_${Date.now()}.jpg` 
        : `SSC_Signature_${Date.now()}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
  </html>
